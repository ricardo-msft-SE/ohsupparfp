<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configure RFP Approver Tab</title>
  <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
  <style>
    :root {
      --text: #1f2a35;
      --muted: #5f6b76;
      --accent: #005ea2;
      --bg: #f7fbff;
      --card: #ffffff;
      --border: #d5e0ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, #eaf4ff, var(--bg));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .card {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
    }

    p {
      margin: 0.45rem 0;
      line-height: 1.45;
      color: var(--muted);
    }

    .url {
      margin-top: 0.75rem;
      font-family: "Cascadia Mono", Consolas, monospace;
      word-break: break-all;
      color: var(--accent);
      background: #f2f8ff;
      border: 1px solid #d3e7ff;
      border-radius: 8px;
      padding: 0.65rem;
    }

    .ok {
      margin-top: 0.85rem;
      color: #2e8540;
      font-weight: 600;
      min-height: 1.3rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Configure RFP Approver</h1>
    <p>This channel tab is preconfigured to open the existing web UI.</p>
    <p>Select <strong>Save</strong> in the Teams dialog to finish adding the tab.</p>
    <p class="url" id="appUrl"></p>
    <div class="ok" id="status"></div>
  </main>

  <script>
    // Dynamically resolve URL so this config page works regardless of host (SWA or other)
    const APP_URL = window.location.origin + "/";

    document.getElementById("appUrl").textContent = APP_URL;

    async function initTeamsConfig() {
      await microsoftTeams.app.initialize();

      // Extract Teams context
      let teamsContext = null;
      try {
        teamsContext = await microsoftTeams.app.getContext();
        console.log("Teams context:", teamsContext);
      } catch (e) {
        console.log("Could not retrieve Teams context:", e);
      }

      microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
        // Pass Teams context to the main app via URL parameter
        let contentUrl = APP_URL;
        let websiteUrl = APP_URL;

        if (teamsContext && teamsContext.user) {
          // Store context in sessionStorage for the main UI to access
          sessionStorage.setItem('teamsContext', JSON.stringify({
            userId: teamsContext.user.id,
            teamId: teamsContext.team?.id,
            channelId: teamsContext.channel?.id,
            tenantId: teamsContext.user.tenant?.id
          }));
        }

        microsoftTeams.pages.config
          .setConfig({
            entityId: "rfp-approver-main",
            suggestedDisplayName: "RFP Approver",
            contentUrl: contentUrl,
            websiteUrl: websiteUrl,
          })
          .then(() => {
            document.getElementById("status").textContent = "Configuration saved.";
            saveEvent.notifySuccess();
          })
          .catch((error) => {
            document.getElementById("status").textContent = "Save failed. Try again.";
            saveEvent.notifyFailure(error.message || "Failed to save configuration");
          });
      });

      microsoftTeams.pages.config.setValidityState(true);
    }

    initTeamsConfig().catch((error) => {
      document.getElementById("status").textContent = "Teams initialization failed.";
      console.error(error);
    });
  </script>
</body>
</html>
