name: Deploy RFP Approver Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC Azure login
  contents: read

env:
  RESOURCE_GROUP: rg-ohsupparfp-web-eus
  RESOURCE_GROUP_LOCATION: eastus
  LOCATION: eastus
  CONTAINER_APP_NAME: ca-rfp-approver-eus
  CONTAINER_REGISTRY_NAME: acrrfpapprovereus
  FOUNDRY_RESOURCE_GROUP: rg-ohsupparfp
  FOUNDRY_RESOURCE_NAME: ohsupparfp-resource
  SEARCH_RESOURCE_GROUP: rg-ohsupparfp
  SEARCH_SERVICE_NAME: aisearch-ohsupparfp

# Required GitHub repository secrets:
#   AZURE_CLIENT_ID          – Service principal / managed identity client ID for OIDC
#   AZURE_TENANT_ID          – Entra tenant ID
#   AZURE_SUBSCRIPTION_ID    – Azure subscription ID
#   MICROSOFT_APP_PASSWORD   – Client secret for the "RFP Approver Bot" Entra app registration
#                              (nnU8Q~… created 2026-07-04, expires 2028-07-04)

jobs:
  # ─── 1. Infrastructure ────────────────────────────────────────────────────
  infra:
    name: Bicep – provision infra
    runs-on: ubuntu-latest
    outputs:
      principal_id: ${{ steps.bicep.outputs.principal_id }}
      acr_login_server: ${{ steps.bicep.outputs.acr_login_server }}
      container_app_fqdn: ${{ steps.bicep.outputs.container_app_fqdn }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: az group create --name $RESOURCE_GROUP --location $RESOURCE_GROUP_LOCATION

      - name: Deploy Bicep and capture outputs
        id: bicep
        run: |
          OUTPUTS=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/main.bicepparam \
            --query "properties.outputs" \
            --output json)
          echo "principal_id=$(echo "$OUTPUTS" | jq -r '.managedIdentityPrincipalId.value')" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(echo "$OUTPUTS" | jq -r '.containerRegistryLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "container_app_fqdn=$(echo "$OUTPUTS" | jq -r '.containerAppFqdn.value')" >> "$GITHUB_OUTPUT"

  # ─── 2. Build Docker image + push to ACR ─────────────────────────────────
  build-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: infra
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Grant deploy SP AcrPush (idempotent)
        run: |
          ACR_ID=$(az acr show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_REGISTRY_NAME" --query id -o tsv)
          SP_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
          az role assignment create \
            --assignee-object-id "$SP_OID" \
            --assignee-principal-type ServicePrincipal \
            --role "AcrPush" \
            --scope "$ACR_ID" \
            --only-show-errors || true

      - name: Log in to ACR
        run: az acr login --name "$CONTAINER_REGISTRY_NAME"

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ needs.infra.outputs.acr_login_server }}/rfp-approver:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          docker build -t "${{ steps.meta.outputs.image_tag }}" ./api
          docker push "${{ steps.meta.outputs.image_tag }}"

  # ─── 3. Deploy to Container App ──────────────────────────────────────────
  deploy:
    name: Deploy to Container App
    runs-on: ubuntu-latest
    needs: [infra, build-push]

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "${{ needs.build-push.outputs.image_tag }}"

      - name: Set bot client secret on Container App
        run: |
          az containerapp secret set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --secrets "microsoftapppassword=${{ secrets.MICROSOFT_APP_PASSWORD }}" || true
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --set-env-vars "MICROSOFT_APP_PASSWORD=secretref:microsoftapppassword"

      - name: Show Container App FQDN
        run: |
          FQDN="${{ needs.infra.outputs.container_app_fqdn }}"
          echo "Bot endpoint: https://$FQDN/api/messages"
          echo "Health check: https://$FQDN/api/health"
          echo "Update teams-app/manifest.json validDomains to: $FQDN"

  # ─── 3. RBAC assignments ──────────────────────────────────────────────────
  rbac:
    name: Assign managed-identity RBAC roles
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure AI User – Foundry resource
        run: |
          SCOPE=$(az cognitiveservices account show \
            --resource-group "$FOUNDRY_RESOURCE_GROUP" \
            --name "$FOUNDRY_RESOURCE_NAME" \
            --query id --output tsv 2>/dev/null || true)
          if [ -n "$SCOPE" ]; then
            az role assignment create \
              --assignee-object-id "${{ needs.infra.outputs.principal_id }}" \
              --assignee-principal-type ServicePrincipal \
              --role "Azure AI User" \
              --scope "$SCOPE" \
              --only-show-errors || true
          else
            echo "::warning::Foundry resource not found - assign 'Azure AI User' role manually to the managed identity"
          fi

      - name: Search Index Data Reader – AI Search service
        run: |
          SCOPE=$(az search service show \
            --resource-group "$SEARCH_RESOURCE_GROUP" \
            --name "$SEARCH_SERVICE_NAME" \
            --query id --output tsv 2>/dev/null || true)
          if [ -n "$SCOPE" ]; then
            az role assignment create \
              --assignee-object-id "${{ needs.infra.outputs.principal_id }}" \
              --assignee-principal-type ServicePrincipal \
              --role "Search Index Data Reader" \
              --scope "$SCOPE" \
              --only-show-errors || true
          else
            echo "::warning::AI Search resource not found - assign 'Search Index Data Reader' role manually to the managed identity"
          fi

      - name: Storage Blob Data Contributor – deploy SP (FC1 package upload)
        run: |
          STORAGE_ID=$(az storage account show \
            --resource-group "$RESOURCE_GROUP" \
            --name stohrfpboteus1 \
            --query id -o tsv 2>/dev/null || true)
          if [ -n "$STORAGE_ID" ]; then
            SP_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
            az role assignment create \
              --assignee-object-id "$SP_OID" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$STORAGE_ID" \
              --only-show-errors || true
          else
            echo "::warning::Storage account not found - assign 'Storage Blob Data Contributor' to deploy SP manually"
          fi
