name: Deploy RFP Approver Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC Azure login
  contents: read

env:
  RESOURCE_GROUP: rg-ohsupparfp-web
  RESOURCE_GROUP_LOCATION: eastus2   # Must match the existing RG's location
  LOCATION: centralus                # Resources are deployed here (quota available)
  FUNCTION_APP_NAME: func-oh-rfp-approver
  FOUNDRY_RESOURCE_GROUP: rg-ohsupparfp
  FOUNDRY_RESOURCE_NAME: ohsupparfp-resource
  SEARCH_RESOURCE_GROUP: rg-ohsupparfp
  SEARCH_SERVICE_NAME: aisearch-ohsupparfp

# Required GitHub repository secrets:
#   AZURE_CLIENT_ID          – Service principal / managed identity client ID for OIDC
#   AZURE_TENANT_ID          – Entra tenant ID
#   AZURE_SUBSCRIPTION_ID    – Azure subscription ID
#   MICROSOFT_APP_PASSWORD   – Client secret for the "RFP Approver Bot" Entra app registration
#                              (nnU8Q~… created 2026-07-04, expires 2028-07-04)

jobs:
  # ─── 1. Infrastructure ────────────────────────────────────────────────────
  infra:
    name: Bicep – provision infra
    runs-on: ubuntu-latest
    outputs:
      principal_id: ${{ steps.bicep.outputs.principal_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: az group create --name $RESOURCE_GROUP --location $RESOURCE_GROUP_LOCATION

      - name: Deploy Bicep and capture outputs
        id: bicep
        run: |
          OUTPUTS=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/main.bicepparam \
            --query "properties.outputs" \
            --output json)
          echo "principal_id=$(echo "$OUTPUTS" | jq -r '.managedIdentityPrincipalId.value')" >> "$GITHUB_OUTPUT"

  # ─── 2. Function App code ─────────────────────────────────────────────────
  deploy-functions:
    name: Deploy Azure Functions code
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set bot client secret on Function App
        run: |
          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --settings "MICROSOFT_APP_PASSWORD=${{ secrets.MICROSOFT_APP_PASSWORD }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and deploy Function App (zip + remote Oryx build)
        run: |
          cd api
          zip -r /tmp/deploy.zip . -x "*.pyc" -x "__pycache__/*" -x ".venv/*"
          az functionapp deploy \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --src-path /tmp/deploy.zip \
            --type zip \
            --async true

  # ─── 3. RBAC assignments ──────────────────────────────────────────────────
  rbac:
    name: Assign managed-identity RBAC roles
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure AI User – Foundry resource
        run: |
          SCOPE=$(az cognitiveservices account show \
            --resource-group "$FOUNDRY_RESOURCE_GROUP" \
            --name "$FOUNDRY_RESOURCE_NAME" \
            --query id --output tsv 2>/dev/null || true)
          if [ -n "$SCOPE" ]; then
            az role assignment create \
              --assignee-object-id "${{ needs.infra.outputs.principal_id }}" \
              --assignee-principal-type ServicePrincipal \
              --role "Azure AI User" \
              --scope "$SCOPE" \
              --only-show-errors || true
          else
            echo "::warning::Foundry resource not found - assign 'Azure AI User' role manually to the managed identity"
          fi

      - name: Search Index Data Reader – AI Search service
        run: |
          SCOPE=$(az search service show \
            --resource-group "$SEARCH_RESOURCE_GROUP" \
            --name "$SEARCH_SERVICE_NAME" \
            --query id --output tsv 2>/dev/null || true)
          if [ -n "$SCOPE" ]; then
            az role assignment create \
              --assignee-object-id "${{ needs.infra.outputs.principal_id }}" \
              --assignee-principal-type ServicePrincipal \
              --role "Search Index Data Reader" \
              --scope "$SCOPE" \
              --only-show-errors || true
          else
            echo "::warning::AI Search resource not found - assign 'Search Index Data Reader' role manually to the managed identity"
          fi

