name: Deploy RFP Approver Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC Azure login
  contents: read

env:
  RESOURCE_GROUP: rg-ohsupparfp-web-cu
  RESOURCE_GROUP_LOCATION: centralus   # Must match the existing RG's location
  LOCATION: centralus                # Resources are deployed here
  FUNCTION_APP_NAME: func-oh-rfp-approver-cu
  FOUNDRY_RESOURCE_GROUP: rg-ohsupparfp
  FOUNDRY_RESOURCE_NAME: ohsupparfp-resource
  SEARCH_RESOURCE_GROUP: rg-ohsupparfp
  SEARCH_SERVICE_NAME: aisearch-ohsupparfp

# Required GitHub repository secrets:
#   AZURE_CLIENT_ID          – Service principal / managed identity client ID for OIDC
#   AZURE_TENANT_ID          – Entra tenant ID
#   AZURE_SUBSCRIPTION_ID    – Azure subscription ID
#   MICROSOFT_APP_PASSWORD   – Client secret for the "RFP Approver Bot" Entra app registration
#                              (nnU8Q~… created 2026-07-04, expires 2028-07-04)

jobs:
  # ─── 1. Infrastructure ────────────────────────────────────────────────────
  infra:
    name: Bicep – provision infra
    runs-on: ubuntu-latest
    outputs:
      principal_id: ${{ steps.bicep.outputs.principal_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: az group create --name $RESOURCE_GROUP --location $RESOURCE_GROUP_LOCATION

      - name: Deploy Bicep and capture outputs
        id: bicep
        run: |
          OUTPUTS=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file ./infra/main.bicep \
            --parameters ./infra/main.bicepparam \
            --query "properties.outputs" \
            --output json)
          echo "principal_id=$(echo "$OUTPUTS" | jq -r '.managedIdentityPrincipalId.value')" >> "$GITHUB_OUTPUT"

  # ─── 2. Function App code ─────────────────────────────────────────────────
  deploy-functions:
    name: Deploy Azure Functions code
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set bot client secret on Function App
        run: |
          az functionapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --settings "MICROSOFT_APP_PASSWORD=${{ secrets.MICROSOFT_APP_PASSWORD }}"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies into .python_packages
        run: |
          pip install -r api/requirements.txt \
            --target api/.python_packages/lib/site-packages \
            --upgrade --quiet

      - name: Deploy to Azure Functions via Kudu zipdeploy
        run: |
          cd api
          zip -r /tmp/deploy.zip . -x "*.pyc" -x "__pycache__/*" -x ".venv/*"
          echo "Zip size: $(du -sh /tmp/deploy.zip | cut -f1)"

          PUBLISH_USER=$(az functionapp deployment list-publishing-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query "publishingUserName" -o tsv)
          PUBLISH_PASS=$(az functionapp deployment list-publishing-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query "publishingPassword" -o tsv)

          HTTP=$(curl -s -o /tmp/kudu_resp.txt -w "%{http_code}" \
            -X POST "https://$FUNCTION_APP_NAME.scm.azurewebsites.net/api/zipdeploy" \
            -u "$PUBLISH_USER:$PUBLISH_PASS" \
            --data-binary @/tmp/deploy.zip \
            -H "Content-Type: application/zip")
          echo "Kudu HTTP: $HTTP"
          cat /tmp/kudu_resp.txt || true
          [[ "$HTTP" == "200" || "$HTTP" == "202" ]] || (echo "Kudu deploy failed" && exit 1)

  # ─── 3. RBAC assignments ──────────────────────────────────────────────────
  rbac:
    name: Assign managed-identity RBAC roles
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure AI User – Foundry resource
        run: |
          SCOPE=$(az cognitiveservices account show \
            --resource-group "$FOUNDRY_RESOURCE_GROUP" \
            --name "$FOUNDRY_RESOURCE_NAME" \
            --query id --output tsv 2>/dev/null || true)
          if [ -n "$SCOPE" ]; then
            az role assignment create \
              --assignee-object-id "${{ needs.infra.outputs.principal_id }}" \
              --assignee-principal-type ServicePrincipal \
              --role "Azure AI User" \
              --scope "$SCOPE" \
              --only-show-errors || true
          else
            echo "::warning::Foundry resource not found - assign 'Azure AI User' role manually to the managed identity"
          fi

      - name: Search Index Data Reader – AI Search service
        run: |
          SCOPE=$(az search service show \
            --resource-group "$SEARCH_RESOURCE_GROUP" \
            --name "$SEARCH_SERVICE_NAME" \
            --query id --output tsv 2>/dev/null || true)
          if [ -n "$SCOPE" ]; then
            az role assignment create \
              --assignee-object-id "${{ needs.infra.outputs.principal_id }}" \
              --assignee-principal-type ServicePrincipal \
              --role "Search Index Data Reader" \
              --scope "$SCOPE" \
              --only-show-errors || true
          else
            echo "::warning::AI Search resource not found - assign 'Search Index Data Reader' role manually to the managed identity"
          fi

      - name: Storage Blob Data Contributor – deploy SP (FC1 package upload)
        run: |
          STORAGE_ID=$(az storage account show \
            --resource-group "$RESOURCE_GROUP" \
            --name stohrfpbottest1 \
            --query id -o tsv 2>/dev/null || true)
          if [ -n "$STORAGE_ID" ]; then
            SP_OID=$(az ad sp show --id "${{ secrets.AZURE_CLIENT_ID }}" --query id -o tsv)
            az role assignment create \
              --assignee-object-id "$SP_OID" \
              --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" \
              --scope "$STORAGE_ID" \
              --only-show-errors || true
          else
            echo "::warning::Storage account not found - assign 'Storage Blob Data Contributor' to deploy SP manually"
          fi
